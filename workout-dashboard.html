<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Workout Dashboard</title>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0B; --card:#161614; --card2:#1C1C19;
  --border:#272522; --border2:#2F2D2A;
  --text:#F5F3EF; --muted:#C0BBB2; --muted2:#9B978F;
  --acc:#7DD3FC; --acc-bg:#061520; --acc-bd:#0D2F45; --acc-hover:#38BDF8;
  --green:#4ADE80; --green-bg:#0A1F0F; --green-bd:#1A3D20;
  --amber:#FCD34D; --amber-bg:#1A1500; --amber-bd:#3D3000;
  --red:#F87171; --red-bg:#1A0A0A; --red-bd:#3D1818;
}
html,body{height:100%;background:var(--bg)}
body{font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;padding:28px 24px;line-height:1.5}

/* Disable double-tap-to-zoom on touch devices but keep pinch zoom intact.
   touch-action:manipulation removes the 300ms tap delay and the
   double-tap-zoom gesture without disabling user-scalable, so accessibility
   zoom still works if needed. */
*{touch-action:manipulation}

/* During an active workout session, hide all sidebar cards except the
   session timer so the screen is focused on the exercises. The session
   card has the .duration-card class, everything else collapses.
   Use !important and a wider selector so it works regardless of layout. */
body.session-running .sidebar > .card:not(.duration-card),
body.session-running #volume-card,
body.session-running #history-card{display:none !important}

/* Fix for mobile auto-zoom on input focus. Browsers (Chrome/Safari) auto-
   zoom into inputs whose font-size is below 16px. We keep visual size
   small by relying on the input's small height + transform-free layout,
   but force font-size to 16px on mobile so the page doesn't zoom in. */
@media (max-width: 900px){
  .set-input,
  input[type="text"],
  input[type="number"],
  input[inputmode="decimal"],
  input[inputmode="numeric"],
  textarea,
  select{
    font-size: 16px !important;
  }
}

.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.header-left .date-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.header-left .date-main{font-family:'Outfit',sans-serif;font-size:42px;font-weight:400;line-height:1}
.header-left .date-sub{font-family:'Outfit',sans-serif;font-size:17px;color:var(--muted);margin-top:4px}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.ghost-btn{display:inline-flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:8px 14px;border-radius:9px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .12s}
.ghost-btn:hover{background:var(--card2);border-color:var(--border2)}
.ghost-btn svg{width:14px;height:14px;opacity:.6}
.start-btn{background:var(--acc-bg);border-color:var(--acc-bd);color:var(--acc)}
.start-btn:hover{background:var(--acc-bd)}
.finish-btn{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.finish-btn:hover{background:var(--green-bd)}

/* Coloured variants for the Continue / New / Add exercise buttons.
   Continue gets green (resume), New gets accent blue (fresh start),
   Add exercise gets accent blue too since it's a primary action. */
.continue-btn{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.continue-btn:hover{background:var(--green-bd);color:#fff}
.continue-btn svg{opacity:1}
.new-session-btn{background:var(--acc-bg);border-color:var(--acc-bd);color:var(--acc)}
.new-session-btn:hover{background:var(--acc-bd);color:#fff}
.new-session-btn svg{opacity:1}
.add-ex-btn{background:var(--acc-bg);border-color:var(--acc-bd);color:var(--acc)}
.add-ex-btn:hover{background:var(--acc-bd);color:#fff}
.add-ex-btn svg{opacity:1}

/* On mobile, scale up the primary action buttons for comfortable tapping.
   The Start/Finish/Continue/New buttons are the lifecycle controls and
   "Add exercise" is the most-tapped action during a session. */
@media (max-width: 720px){
  .start-btn, .finish-btn, .continue-btn, .new-session-btn, .add-ex-btn{
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 11px;
    font-weight: 600;
  }
  .start-btn svg, .finish-btn svg, .continue-btn svg,
  .new-session-btn svg, .add-ex-btn svg{
    width: 16px;
    height: 16px;
  }
  /* Wrap the action button row so they don't squash on narrow screens */
  .header-right{flex-wrap: wrap; justify-content: flex-end}
}

.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;animation:fadeUp .2s ease both}
.card:last-child{margin-bottom:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:6px;border:1px solid}
.badge-acc{color:var(--acc);background:var(--acc-bg);border-color:var(--acc-bd)}
.badge-green{color:var(--green);background:var(--green-bg);border-color:var(--green-bd)}
.badge-amber{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
.badge-muted{color:var(--muted);background:var(--card2);border-color:var(--border2)}
.card-head-meta{font-size:11px;color:var(--muted);margin-left:auto}

/* Workout duration stopwatch */
.duration-card{}
.duration-display{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.duration-time{font-family:'Outfit',sans-serif;font-size:36px;font-weight:300;line-height:1;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.duration-time.idle{color:var(--muted2)}
.duration-time.running{color:var(--acc)}
.duration-time.finished{color:var(--green)}
.duration-status{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Workout selection */
.workouts-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding-right:2px}
.workouts-list::-webkit-scrollbar{width:3px}
.workouts-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.wk-pill{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;user-select:none}
.wk-pill:hover{border-color:var(--border2);background:var(--card2)}
.wk-pill.active{border-color:var(--acc-bd);background:var(--acc-bg)}
.wk-pill-name{font-size:13px;font-weight:500;flex:1;line-height:1.3}
.wk-pill.active .wk-pill-name{color:var(--acc)}
.wk-pill-type{font-size:11px;color:var(--muted);margin-top:1px}
.wk-pill-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0}
.wk-pill.active .wk-pill-dot{background:var(--acc)}
.wk-add-btn{width:100%;margin-top:8px;padding:9px;border-radius:9px;border:1px dashed var(--border2);background:none;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.wk-add-btn:hover{border-color:var(--muted2);color:var(--text);background:var(--card2)}
.wk-pill-edit{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:12px;padding:2px 4px;opacity:0;transition:opacity .15s}
.wk-pill:hover .wk-pill-edit{opacity:1}
.wk-pill-edit:hover{color:var(--text)}

/* Week progress */
.week-prog-row{display:flex;gap:4px;margin-bottom:6px}
.week-prog-cell{flex:1;height:5px;border-radius:99px;background:var(--border2);overflow:hidden}
.week-prog-fill{height:100%;border-radius:99px;background:var(--green);transition:width .4s ease}
.week-day-row{display:flex;justify-content:space-between;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:14px}
.week-day-row span{flex:1;text-align:center}
.week-day-row span.today-ind{color:var(--acc)}
.week-day-row span.done-ind{color:var(--green)}
.week-stats{display:flex;gap:16px}
.week-stat{display:flex;flex-direction:column}
.week-stat-val{font-family:'Outfit',sans-serif;font-size:22px;font-weight:400;line-height:1}
.week-stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* Exercise list */
.ex-section{margin-bottom:18px}
.ex-section:last-child{margin-bottom:0}
.ex-section-title{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ex-list{display:flex;flex-direction:column;gap:8px}

.ex-item{border:1px solid var(--border);border-radius:11px;overflow:hidden;transition:border-color .15s}
.ex-item.done{border-color:var(--green-bd);background:var(--green-bg)}

.ex-header{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .12s}
.ex-header:hover{background:var(--card2)}
.ex-item.done .ex-header:hover{background:rgba(74,222,128,.05)}
.ex-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ex-item.done .ex-check{background:var(--green);border-color:var(--green)}
.ex-check svg{display:none;width:11px;height:11px}
.ex-item.done .ex-check svg{display:block}
.ex-name{font-size:14px;font-weight:500;flex:1}
.ex-item.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-sets-summary{font-size:11px;color:var(--muted);white-space:nowrap}
.ex-chevron{width:16px;height:16px;color:var(--muted);flex-shrink:0;transition:transform .2s}
.ex-item.expanded .ex-chevron{transform:rotate(180deg)}
.ex-del-btn{background:none;border:none;color:var(--muted2);cursor:pointer;padding:2px 4px;font-size:13px;opacity:0;transition:all .12s}
.ex-header:hover .ex-del-btn{opacity:1}
.ex-del-btn:hover{color:var(--red)}
.ex-drag{display:flex;align-items:center;padding:0 6px 0 0;cursor:grab;color:var(--muted2);flex-shrink:0;touch-action:none}
.ex-drag:active{cursor:grabbing}
.ex-set-actions{display:flex;gap:6px;margin-top:4px}
.ex-remove-set{color:var(--red);border-color:var(--red-bd) !important}
.ex-remove-set:hover:not(.ex-remove-disabled){background:var(--red-bg) !important;color:var(--red) !important}
.ex-remove-disabled{opacity:.35;cursor:not-allowed !important}
.ex-item.dragging{opacity:.4;border-style:dashed}
.ex-item.drag-over{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}

.ex-sets{display:none;padding:0 14px 14px;flex-direction:column;gap:6px;border-top:1px solid var(--border)}
.ex-item.expanded .ex-sets{display:flex;padding-top:12px}

.sets-row-head{display:grid;grid-template-columns:28px 1fr 1fr 1fr 38px;gap:8px;padding:0 2px;margin-bottom:2px}
.sets-row-head span{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.set-row{display:grid;grid-template-columns:28px 1fr 1fr 1fr 38px;gap:8px;align-items:center;padding:5px 4px;border-radius:8px;transition:background .12s;position:relative}
.set-row.type-warmup{background:rgba(252,211,77,.05)}
.set-row.type-warmup .set-num{color:var(--amber)}
.set-row.type-failure{background:rgba(248,113,113,.05)}
.set-row.type-failure .set-num{color:var(--red)}
.set-row.type-cardio{background:rgba(125,211,252,.05)}
.set-row.type-cardio .set-num{color:var(--acc)}
.set-type-select{cursor:pointer;text-align:left;padding:6px 8px;background-image:none;appearance:none;-webkit-appearance:none}
.set-type-warmup{color:var(--amber);border-color:var(--amber-bd) !important;background:var(--amber-bg) !important}
.set-type-failure{color:var(--red);border-color:var(--red-bd) !important;background:var(--red-bg) !important}
.set-type-cardio{color:var(--acc);border-color:var(--acc-bd) !important;background:var(--acc-bg) !important}
.set-row:hover{background:var(--card2)}
.set-row.set-done{background:rgba(74,222,128,.06)}
.set-num{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.set-input{background:var(--card2);border:1px solid var(--border2);border-radius:7px;padding:6px 8px;font-size:16px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s;width:100%;text-align:center;min-width:0}
.set-input:focus{border-color:var(--acc-bd)}
.set-input::placeholder{color:var(--muted2);opacity:.85}
/* When the placeholder is a ghost value (data-last set), style it more
   distinctly so it reads as "your last session's number". */
.set-input[data-last]:not([data-last=""])::placeholder{color:var(--muted);font-style:italic;opacity:.55}
.set-input:disabled{opacity:.45;cursor:not-allowed}

/* SMALLER tick — fixes the "too big tick" bug */
.set-done-btn{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border2);background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;padding:0;justify-self:center}
.set-done-btn svg{width:11px;height:11px;display:block}
.set-done-btn:hover{border-color:var(--green-bd);color:var(--green)}
.set-row.set-done .set-done-btn{background:var(--green);border-color:var(--green);color:#0D0D0B}
.set-row.set-done .set-input{opacity:.55;border-color:transparent}

.ex-add-set{width:100%;margin-top:4px;padding:7px;border-radius:8px;border:1px dashed var(--border2);background:none;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.ex-add-set:hover{border-color:var(--muted2);color:var(--text);background:var(--card2)}

/* Per-exercise rest timer (inline) */
.ex-rest{display:none;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--amber-bg);border:1px solid var(--amber-bd)}
.ex-rest.active{display:flex}
.ex-rest.done-state{background:var(--green-bg);border-color:var(--green-bd)}
.ex-rest-icon{width:14px;height:14px;color:var(--amber);flex-shrink:0}
.ex-rest.done-state .ex-rest-icon{color:var(--green)}
.ex-rest-time{font-family:'Outfit',sans-serif;font-size:18px;font-weight:400;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ex-rest.done-state .ex-rest-time{color:var(--green)}
.ex-rest-bar{flex:1;height:4px;background:rgba(252,211,77,.18);border-radius:99px;overflow:hidden;min-width:50px}
.ex-rest-bar-fill{height:100%;background:var(--amber);border-radius:99px;transition:width .5s linear}
.ex-rest.done-state .ex-rest-bar-fill{background:var(--green)}
.ex-rest-cancel{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:11px;padding:2px 8px;border-radius:5px;font-family:'DM Sans',sans-serif;transition:color .12s}
.ex-rest-cancel:hover{color:var(--text)}
.ex-rest-config{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;background:var(--card2);border:1px solid var(--border2);border-radius:9px}
.ex-rest-config-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.rest-time-input{display:flex;align-items:center;gap:4px}
.rest-time-input input{width:40px;background:var(--card);border:1px solid var(--border2);border-radius:5px;padding:4px 6px;font-size:12px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;text-align:center}
.rest-time-input input:focus{border-color:var(--acc-bd)}
.rest-time-input span{font-size:11px;color:var(--muted)}
.preset-mini{display:flex;gap:4px}
.preset-mini button{padding:3px 7px;font-size:11px;border-radius:5px;border:1px solid var(--border2);background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .12s}
.preset-mini button:hover{color:var(--text);background:var(--card)}
.preset-mini button.sel{background:var(--acc-bg);border-color:var(--acc-bd);color:var(--acc)}

/* Workout complete banner */
.complete-banner{display:none;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;background:var(--green-bg);border:1px solid var(--green-bd);margin-bottom:14px}
.complete-banner.show{display:flex}
.complete-banner-icon{font-size:24px;flex-shrink:0}
.complete-banner-title{font-size:14px;font-weight:600;color:var(--green)}
.complete-banner-sub{font-size:12px;color:var(--muted);margin-top:2px}
.complete-banner-dismiss{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
.complete-banner-dismiss:hover{color:var(--text)}

/* Volume */
.vol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vol-stat{background:var(--card2);border-radius:9px;padding:10px 12px}
.vol-stat-val{font-family:'Outfit',sans-serif;font-size:20px;font-weight:400;line-height:1}
.vol-stat-lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* Personal records / swim totals badge — sits under the exercise header,
   visible whether the exercise is expanded or collapsed. */
.ex-pr{
  font-size:11px;color:var(--muted);
  padding:4px 14px 8px 38px;
  border-bottom:1px solid var(--border);
  display:none;
}
.ex-item.expanded .ex-pr{display:block}
.ex-pr .pr-row{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.ex-pr .pr-label{
  text-transform:uppercase;letter-spacing:.08em;font-weight:600;
  font-size:9px;color:var(--muted2);
}
.ex-pr .pr-val{
  color:var(--text);font-family:'Outfit',sans-serif;font-weight:400;
  font-size:12px;font-variant-numeric:tabular-nums;
}
.ex-pr .pr-sep{color:var(--muted2);margin:0 2px}
.ex-pr .pr-when{
  margin-left:6px;font-size:10px;color:var(--muted2);
  font-style:italic;
}
.ex-pr .pr-empty{color:var(--muted2);font-size:11px;font-style:italic}
.ex-pr .pr-new{
  margin-left:8px;color:var(--green);font-weight:600;font-size:11px;
  background:var(--green-bg);border:1px solid var(--green-bd);
  padding:2px 8px;border-radius:6px;
  animation:pr-pulse 1.2s ease-in-out infinite;
}
@keyframes pr-pulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(74,222,128,0)}
  50%{transform:scale(1.04);box-shadow:0 0 0 4px rgba(74,222,128,.12)}
}

/* Swim stroke coloured pills via the type select */
.set-stroke-free{color:var(--acc);border-color:var(--acc-bd) !important;background:var(--acc-bg) !important}
.set-stroke-back{color:#A78BFA;border-color:#3B2A5C !important;background:#161029 !important}
.set-stroke-breast{color:#F472B6;border-color:#3D1828 !important;background:#190A12 !important}
.set-stroke-fly{color:var(--amber);border-color:var(--amber-bd) !important;background:var(--amber-bg) !important}
.set-stroke-im{color:#34D399;border-color:#0A3020 !important;background:#041510 !important}
.set-stroke-kick{color:var(--muted);border-color:var(--border2) !important}
.set-stroke-pull{color:var(--muted);border-color:var(--border2) !important}
.set-stroke-drill{color:var(--muted2);border-color:var(--border2) !important;font-style:italic}

/* History */
.hist-list{display:flex;flex-direction:column;gap:6px}
.hist-item{
  background:var(--card2);border:1px solid var(--border2);border-radius:9px;
  padding:9px 11px;cursor:pointer;transition:border-color .12s,background .12s;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-family:'DM Sans',sans-serif;
}
.hist-item:hover{border-color:var(--acc-bd);background:var(--card)}
.hist-item-left{min-width:0;flex:1}
.hist-item-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item-meta{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.hist-item-stat{font-family:'Outfit',sans-serif;font-size:14px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.hist-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 8px;font-style:italic}
.hist-all-btn{
  border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;
  padding:2px 8px;border-radius:6px;font-family:'DM Sans',sans-serif;transition:color .12s,background .12s;
  letter-spacing:.04em;
}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:12px 18px;font-size:13px;color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .2s;z-index:500;white-space:nowrap}

/* Touch-device input sizing.
   This block fires on physical touch devices regardless of whether
   "Request desktop site" is on. Mobile media queries get ignored in
   desktop mode (the browser pretends it's a 1024px laptop), but
   pointer/hover queries still detect the actual hardware. We bump
   set-input fields to a large font + tall height so Chrome's
   auto-zoom-on-focus doesn't trigger. */
@media (pointer: coarse) and (hover: none) {
  .set-input{
    font-size: 22px;

  }
}

<script>
// Apply session-running class as early as possible so the History/Workouts/
// Volume/Week cards don't flash visible during a running session. Uses the
// same localStorage key as the main script. Wrapped in try-catch since this
// runs before sync.js attaches its overrides.
(function(){
  try{
    var raw = localStorage.getItem('wt_session_timer');
    if(!raw) return;
    var t = JSON.parse(raw);
    if(t && t.start && !t.end) document.body.classList.add('session-running');
  }catch(e){}
})();
</script>

function loadWorkouts(){

// Seed-once migration: append any new default workouts that the user
// doesn't already have, without touching their existing customisations.
// Bump SEED_VERSION when DEFAULT_WORKOUTS gains new entries.
const SEED_VERSION_KEY = 'wt_seed_version';
const SEED_VERSION = 'v3-pull-push-cycling';
function maybeSeedWorkouts(){
  if(localStorage.getItem(SEED_VERSION_KEY) === SEED_VERSION) return;
  try{
    const stored = localStorage.getItem(WORKOUTS_KEY);
    if(!stored){
      // No local workouts at all — defaults will load on first run.
      localStorage.setItem(SEED_VERSION_KEY, SEED_VERSION);
      return;
    }
    const existing = JSON.parse(stored) || [];
    const existingIds = new Set(existing.map(w => w.id));
    let changed = false;
    DEFAULT_WORKOUTS.forEach(def => {
      if(!existingIds.has(def.id)){
        existing.push(def);
        changed = true;
      }
    });
    if(changed) saveWorkouts(existing);
    localStorage.setItem(SEED_VERSION_KEY, SEED_VERSION);
  }catch(e){ /* ignore — non-fatal */ }
}
maybeSeedWorkouts();

function fmtDuration(s){

  }

function getWeekStart(d){ // Monday as week start
  const r = new Date(d); const dow = r.getDay(); const off = (dow+6)%7; r.setDate(r.getDate()-off); r.setHours(0,0,0,0); return r;
}
function getWeekDates(){
  const start = getWeekStart(today);
  return Array.from({length:7},(_,i)=>fmtDate(addDays(start,i)));
}
function loadSessionLog(){ try{ return JSON.parse(localStorage.getItem(SESSION_LOG_KEY))||[]; }catch(e){ return []; } }
function saveSessionLog(l){ localStorage.setItem(SESSION_LOG_KEY, JSON.stringify(l)); }

function isWorkoutDoneOnDay(date){
  // A day counts as "done" if any session was logged for that date
  const log = loadSessionLog();
  if(log.some(s=>s.date===date)) return true;
  const completed = loadCompletedDays();
  if(completed[date]) return true;
  const s = loadSession(date);
  return Object.keys(s).some(k=>k.endsWith('_done') && s[k]);
}

// Get the most recent set data for an exercise from prior sessions (for placeholders)
function getLastSetsFor(exId){
  const log = loadSessionLog();
  // Look from most recent backwards, skip today's in-progress session
  for(let i=log.length-1; i>=0; i--){
    const entry = log[i];
    const sets = entry.sets?.[exId];
    if(sets && sets.length){
      return sets.filter(s=>s.done).map(s=>({reps:s.reps, weight:s.weight, type:s.type}));
    }
  }
  return [];
}

// Estimated 1RM via the Epley formula: w × (1 + r/30).
// Reasonably accurate in the 1-10 rep range, less reliable above ~12 reps.
function estimate1RM(weight, reps){
  const w = parseFloat(weight);
  const r = parseInt(reps);
  if(!isFinite(w) || w <= 0 || !isFinite(r) || r <= 0) return 0;
  if(r === 1) return w;
  // Cap at 12 reps for 1RM estimation; beyond that the formula falls apart.
  const cappedReps = Math.min(r, 12);
  return w * (1 + cappedReps/30);
}

// Compute personal records for an exercise from the full session log.
// Returns {bestSet:{weight,reps,date}, best1RM:{weight,reps,e1rm,date}, totalSessions, lastDate}
// "Best set" = highest weight × reps. "Best 1RM" = highest estimated 1RM.
// Warm-up sets and unset/empty values are excluded.
function computePR(exId, opts={}){
  const {excludeToday = false} = opts;
  const log = loadSessionLog();
  let bestSet = null;
  let best1RM = null;
  let totalSessions = 0;
  let lastDate = null;

  for(const entry of log){
    if(excludeToday && entry.date === TODAY) continue;
    const sets = entry.sets?.[exId];
    if(!sets || !sets.length) continue;
    let countedThisSession = false;
    for(const s of sets){
      if(!s.done) continue;
      if(s.type === 'warmup') continue;
      const w = parseFloat(s.weight);
      const r = parseInt(s.reps);
      if(!isFinite(w) || w <= 0 || !isFinite(r) || r <= 0) continue;
      if(!countedThisSession){ totalSessions++; countedThisSession = true; }
      lastDate = entry.date;
      // Best top set: prefer higher weight; tiebreak on reps.
      if(!bestSet || w > bestSet.weight || (w === bestSet.weight && r > bestSet.reps)){
        bestSet = {weight:w, reps:r, date:entry.date};
      }
      const e1rm = estimate1RM(w, r);
      if(!best1RM || e1rm > best1RM.e1rm){
        best1RM = {weight:w, reps:r, e1rm, date:entry.date};
      }
    }
  }
  return {bestSet, best1RM, totalSessions, lastDate};
}

// Returns the best (weight, reps) of completed sets in the CURRENT session
// for an exercise, used to detect whether the user has just hit a new PR.
function bestCurrentSet(exId){
  const sets = session[exId+'_sets'] || [];
  let best = null;
  for(const s of sets){
    if(!s.done || s.type === 'warmup') continue;
    const w = parseFloat(s.weight);
    const r = parseInt(s.reps);
    if(!isFinite(w) || w <= 0 || !isFinite(r) || r <= 0) continue;
    if(!best || w > best.weight || (w === best.weight && r > best.reps)){
      best = {weight:w, reps:r};
    }
  }
  return best;
}

// Format a date string YYYY-MM-DD as "5 May" or "Today" / "Yesterday".
function fmtPRDate(dateStr){
  if(!dateStr) return '';
  if(dateStr === TODAY) return 'today';
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const diffDays = Math.round((today - dt) / 86400000);
  if(diffDays === 1) return 'yesterday';
  if(diffDays < 7) return `${diffDays}d ago`;
  if(diffDays < 30) return `${Math.round(diffDays/7)}w ago`;
  return `${dt.getDate()} ${MON_SHORT[dt.getMonth()]}`;
}

// Update only the PR display for one exercise (live update during a session
// when the user finishes a set) without re-rendering the whole workout view.
function renderPRsFor(exId){
  const el = document.getElementById('pr-'+exId);
  if(!el) return;
  const w = getActiveWorkout();
  if(!w || w.kind === 'swim') return; // PRs don't make sense for swim
  el.innerHTML = buildPRBadgeHTML(exId);
}

function buildPRBadgeHTML(exId){
  const pr = computePR(exId, {excludeToday: true});
  const cur = bestCurrentSet(exId);
  if(!pr.bestSet){
    // No prior data — just suggest tracking
    if(!cur) return '<span class="pr-empty">No prior records yet. Log a set to start tracking PRs.</span>';
    // No prior, but they've done a set today — show today's best
    return `<span class="pr-row"><span class="pr-label">First session</span><span class="pr-val">${cur.weight} kg × ${cur.reps}</span></span>`;
  }
  // Detect if current session has a new PR (top set beats prior best top set)
  let beatsPR = false;
  if(cur){
    if(cur.weight > pr.bestSet.weight) beatsPR = true;
    else if(cur.weight === pr.bestSet.weight && cur.reps > pr.bestSet.reps) beatsPR = true;
  }
  const e1rm = Math.round(pr.best1RM.e1rm * 10) / 10;
  const when = fmtPRDate(pr.bestSet.date);
  const trophy = beatsPR ? '<span class="pr-new">🏆 New PR!</span>' : '';
  return `
    <span class="pr-row">
      <span class="pr-label">Best</span>
      <span class="pr-val">${pr.bestSet.weight} kg × ${pr.bestSet.reps}</span>
      <span class="pr-sep">·</span>
      <span class="pr-label">est. 1RM</span>
      <span class="pr-val">${e1rm} kg</span>
      <span class="pr-when">${when}</span>
      ${trophy}
    </span>`;
}

// Swim equivalent: instead of strength PRs, show total distance done in
// the current session for this exercise plus totals from the last logged
// session as a comparator.
function buildSwimTotalsHTML(exId){
  const curSets = session[exId+'_sets'] || [];
  const curDist = curSets.reduce((sum, s) => {
    if(!s.done) return sum;
    const d = parseFloat(s.reps);
    return sum + (isFinite(d) && d > 0 ? d : 0);
  }, 0);

  // Last session totals
  const last = getLastSetsFor(exId);
  const lastDist = last.reduce((sum, s) => {
    const d = parseFloat(s.reps);
    return sum + (isFinite(d) && d > 0 ? d : 0);
  }, 0);
  const lastDate = (() => {
    const log = loadSessionLog();
    for(let i=log.length-1; i>=0; i--){
      if(log[i].sets?.[exId]) return log[i].date;
    }
    return null;
  })();

  if(!curDist && !lastDist) return '<span class="pr-empty">No swim data yet. Log a set to start tracking distance.</span>';

  let html = '<span class="pr-row">';
  if(curDist){
    html += `<span class="pr-label">This session</span><span class="pr-val">${curDist} m</span>`;
  }
  if(lastDist){
    if(curDist) html += '<span class="pr-sep">·</span>';
    html += `<span class="pr-label">Last</span><span class="pr-val">${lastDist} m</span>`;
    if(lastDate) html += `<span class="pr-when">${fmtPRDate(lastDate)}</span>`;
  }
  html += '</span>';
  return html;
}

function getWeeklyStreak(){
  // Count consecutive past weeks (including this one if done) with at least 1 workout
  let streak = 0;
  const start = getWeekStart(today);
  for(let w=0; w<104; w++){
    const ws = addDays(start, -7*w);
    const dates = Array.from({length:7},(_,i)=>fmtDate(addDays(ws,i)));
    const anyDone = dates.some(d=>isWorkoutDoneOnDay(d));
    if(anyDone) streak++;
    else if(w===0) continue; // current week: don't break if not done yet
    else break;
  }
  return streak;
}
function getAllTimeCount(){
  const completed = loadCompletedDays();
  return Object.keys(completed).length;
}

function renderWeek(){
  const dates = getWeekDates();

  const todayIdx = dates.indexOf(TODAY);
  let doneThisWeek = 0;

  const cells = dates.map((d,i)=>{

          ? `<select class="set-input set-type-select set-stroke-${curType}" onchange="updateSet('${esc(ex.id)}',${i},'type',this.value)">
              <option value="free"${curType==='free'?' selected':''}>Free</option>
              <option value="back"${curType==='back'?' selected':''}>Back</option>
              <option value="breast"${curType==='breast'?' selected':''}>Breast</option>
              <option value="fly"${curType==='fly'?' selected':''}>Fly</option>
              <option value="im"${curType==='im'?' selected':''}>IM</option>
              <option value="kick"${curType==='kick'?' selected':''}>Kick</option>
              <option value="pull"${curType==='pull'?' selected':''}>Pull</option>
              <option value="drill"${curType==='drill'?' selected':''}>Drill</option>
            </select>`
          : `<select class="set-input set-type-select set-type-${curType}" onchange="updateSet('${esc(ex.id)}',${i},'type',this.value)">
              <option value="normal"${curType==='normal'?' selected':''}>Normal</option>
              <option value="warmup"${curType==='warmup'?' selected':''}>Warmup</option>
              <option value="failure"${curType==='failure'?' selected':''}>Failure</option>
              <option value="cardio"${curType==='cardio'?' selected':''}>Cardio</option>
            </select>`;
        const rowClass = isSwim ? '' : `type-${curType}`;
        html += `<div class="set-row${sd.done?' set-done':''} ${rowClass}" id="sr-${esc(ex.id)}-${i}">
          <div class="set-num">${i+1}</div>
          <input class="set-input" type="text" inputmode="${isSwim?'numeric':'decimal'}" value="${esc(sd.reps||'')}"
                 placeholder="${esc(lastReps || repsLabel)}"
                 data-last="${esc(lastReps)}"
                 data-field="reps"
                 onfocus="ghostFocus(this)"
                 onchange="updateSet('${esc(ex.id)}',${i},'reps',this.value)">
          <input class="set-input" type="text" inputmode="${isSwim?'text':'decimal'}" value="${esc(sd.weight||'')}"
                 placeholder="${esc(lastWeight || weightLabel)}"
                 data-last="${esc(lastWeight)}"
                 data-field="weight"
                 onfocus="ghostFocus(this)"
                 onchange="updateSet('${esc(ex.id)}',${i},'weight',this.value)">
          ${typeSelect}
          <button class="set-done-btn" onclick="toggleSetDone('${esc(ex.id)}',${i})">${sd.done?CHK:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8l3 3 5-5"/></svg>'}</button>
        </div>`;
      });

      html += `<div class="ex-set-actions">
          <button class="ex-add-set" onclick="addSet('${esc(ex.id)}')">+ Add set</button>
          <button class="ex-add-set ex-remove-set${setData.length<=1?' ex-remove-disabled':''}" onclick="removeSet('${esc(ex.id)}')">− Remove last</button>
        </div>

        <div class="ex-rest-config">
          <span class="ex-rest-config-label">Rest</span>
          <div class="rest-time-input">
            <input type="number" id="rest-min-${esc(ex.id)}" value="${restMin}" min="0" max="59" onchange="updateExRest('${esc(ex.id)}')"><span>m</span>
            <input type="number" id="rest-sec-${esc(ex.id)}" value="${restSec}" min="0" max="59" onchange="updateExRest('${esc(ex.id)}')"><span>s</span>
          </div>
          <div class="preset-mini">
            ${presets.map(p=>`<button class="${(ex.rest||0)===p?'sel':''}" onclick="setExRestPreset('${esc(ex.id)}',${p})">${p<60?p+'s':(p/60)+'m'}</button>`).join('')}
          </div>
        </div>

        <div class="ex-rest" id="rest-${esc(ex.id)}">
          <svg class="ex-rest-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="6"/><path d="M8 5v4l2 2"/><path d="M6 1h4"/></svg>
          <div class="ex-rest-time" id="rest-time-${esc(ex.id)}">0:00</div>
          <div class="ex-rest-bar"><div class="ex-rest-bar-fill" id="rest-fill-${esc(ex.id)}" style="width:100%"></div></div>
          <button class="ex-rest-cancel" onclick="cancelExTimer('${esc(ex.id)}')">Skip</button>
        </div>

        </div>
      </div>`;
    });
    html += `</div></div>`;
  });

  document.getElementById('exercise-list').innerHTML = html;

  // Notes - permanent, not tied to date or session
  const notes = document.getElementById('workout-notes');
  if(!notes._wired){
    notes.value = localStorage.getItem(NOTES_KEY) || '';
    notes.addEventListener('input', () => localStorage.setItem(NOTES_KEY, notes.value));
    notes._wired = true;
  }
}

function toggleEx(id){
  const el = document.getElementById('ex-'+id);
  if(el) el.classList.toggle('expanded');
}

function deleteExercise(id){
  if(!confirm('Delete this exercise from this workout?')) return;
  const w = getActiveWorkout();
  w.exercises = w.exercises.filter(e=>e.id!==id);
  saveWorkouts(workouts);
  delete session[id+'_done']; delete session[id+'_sets'];
  saveSession(TODAY, session);
  renderWorkout();
}

// Hevy-style ghost-value behaviour: when an input has a placeholder showing
// the previous session's number, tapping it pre-fills the value so the user
// can keep, tweak, or clear it. Only triggers if the field is empty.
function ghostFocus(input){
  if(input.value !== '' && input.value != null) return;
  const last = input.dataset.last;
  if(!last) return;
  input.value = last;
  // Trigger native change so updateSet runs
  input.dispatchEvent(new Event('change', {bubbles:true}));
  // Select all so the user can immediately overtype
  setTimeout(()=>{ try{ input.select(); }catch(e){} }, 0);
}

function updateSet(exId, idx, field, val){
  const ex = findEx(exId); if(!ex) return;
  if(!session[exId+'_sets']) session[exId+'_sets'] = Array.from({length:ex.sets},()=>({reps:'',weight:'',type:'normal',done:false}));
  if(!session[exId+'_sets'][idx]) session[exId+'_sets'][idx]={};
  session[exId+'_sets'][idx][field] = val;
  saveSession(TODAY, session);
  renderVolume();
  renderHistory();
  renderPRsFor(exId);
  if(field==='type'){
    // re-render to update color tag
    renderWorkout();
    Object.keys(exTimers).forEach(updateExTimerUI);
  }
}

function toggleSetDone(exId, idx){
  const ex = findEx(exId); if(!ex) return;
  if(!session[exId+'_sets']) session[exId+'_sets'] = Array.from({length:ex.sets},()=>({reps:'',weight:'',type:'normal',done:false}));
  if(!session[exId+'_sets'][idx]) session[exId+'_sets'][idx]={};
  const wasDone = session[exId+'_sets'][idx].done;

  // PR detection: if we're marking a set DONE, capture the prior PR
  // before mutating session, then check whether this set beats it.
  let priorPR = null;
  if(!wasDone){ priorPR = computePR(exId, {excludeToday: true}); }

  session[exId+'_sets'][idx].done = !wasDone;

  // Auto-mark exercise done if all sets done
  const allDone = session[exId+'_sets'].every(s=>s.done);
  if(allDone) session[exId+'_done'] = true;
  else delete session[exId+'_done'];

  saveSession(TODAY, session);

  // Auto-start session if not already running
  if(!wasDone && !sessionTimer){
    sessionTimer = { start: Date.now(), end: null };
    saveSessionTimer(sessionTimer);
    document.getElementById('start-workout-btn').style.display = 'none';
    document.getElementById('finish-workout-btn').style.display = 'inline-flex';
    startSessionTick();
    setSessionRunningClass();
  }

  // Auto-start that exercise's rest timer when a set is marked done
  if(!wasDone && (ex.rest||0) > 0 && !allDone){
    startExTimer(exId);
  }

  // PR check after toggling done. Only show toast if we just completed a set
  // (not on un-toggle), and only for non-warmup sets with valid weight × reps.
  if(!wasDone && priorPR && getActiveWorkout()?.kind !== 'swim'){
    const sd = session[exId+'_sets'][idx];
    if(sd.type !== 'warmup'){
      const w = parseFloat(sd.weight), r = parseInt(sd.reps);
      if(isFinite(w) && w > 0 && isFinite(r) && r > 0){
        const beatsTopSet = !priorPR.bestSet
          || w > priorPR.bestSet.weight
          || (w === priorPR.bestSet.weight && r > priorPR.bestSet.reps);
        const newE1RM = estimate1RM(w, r);
        const beats1RM = !priorPR.best1RM || newE1RM > priorPR.best1RM.e1rm + 0.1;
        if(beatsTopSet && priorPR.bestSet){
          showToast(`🏆 New PR for ${ex.name}: ${w} kg × ${r}`, 4000);
        } else if(beats1RM && priorPR.best1RM){
          showToast(`📈 Estimated 1RM up to ${Math.round(newE1RM*10)/10} kg`, 3500);
        }
      }
    }
  }

  renderWorkout();
  // Re-show running timers
  Object.keys(exTimers).forEach(updateExTimerUI);
  renderVolume();
  renderHistory();
}

function addSet(exId){
  const w = getActiveWorkout(); const ex = w.exercises.find(e=>e.id===exId); if(!ex) return;
  // Ensure session sets array matches current ex.sets before adding
  if(!session[exId+'_sets']) session[exId+'_sets'] = Array.from({length:ex.sets},(_,i)=>({reps:'',weight:'',type:'normal',done:false}));
  ex.sets = session[exId+'_sets'].length + 1;
  session[exId+'_sets'].push({reps:'',weight:'',type:'normal',done:false});
  saveWorkouts(workouts);
  saveSession(TODAY, session);
  renderWorkout();
  Object.keys(exTimers).forEach(updateExTimerUI);
}

function removeSet(exId){
  const w = getActiveWorkout(); const ex = w.exercises.find(e=>e.id===exId); if(!ex) return;
  if(!session[exId+'_sets']) session[exId+'_sets'] = Array.from({length:ex.sets},()=>({reps:'',weight:'',type:'normal',done:false}));
  if(session[exId+'_sets'].length <= 1){ showToast('Need at least 1 set'); return; }
  session[exId+'_sets'].pop();
  ex.sets = session[exId+'_sets'].length;
  saveWorkouts(workouts);
  saveSession(TODAY, session);
  renderWorkout();
  Object.keys(exTimers).forEach(updateExTimerUI);
}

function updateExRest(exId){
  const w = getActiveWorkout(); const ex = w.exercises.find(e=>e.id===exId); if(!ex) return;
  const m = parseInt(document.getElementById('rest-min-'+exId)?.value)||0;
  const s = parseInt(document.getElementById('rest-sec-'+exId)?.value)||0;
  ex.rest = m*60 + s;
  saveWorkouts(workouts);
  // Re-render the presets to update active state
  renderWorkout();
  Object.keys(exTimers).forEach(updateExTimerUI);
}
function setExRestPreset(exId, val){
  const w = getActiveWorkout(); const ex = w.exercises.find(e=>e.id===exId); if(!ex) return;
  ex.rest = val;
  saveWorkouts(workouts);
  renderWorkout();
  Object.keys(exTimers).forEach(updateExTimerUI);
}

// ════════════ DRAG TO REORDER ════════════
let dragId = null, dragOverId = null;
function startDrag(e, exId){
  e.stopPropagation();
  dragId = exId;
  const el = document.getElementById('ex-'+exId);
  if(el) el.classList.add('dragging');
  const onMove = ev=>{
    const touch = ev.touches?.[0] || ev;
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const item = target?.closest('.ex-item');
    if(item && item.id !== 'ex-'+dragId){
      const newOver = item.id.replace('ex-','');
      if(newOver !== dragOverId){
        document.querySelectorAll('.ex-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
        dragOverId = newOver;
        item.classList.add('drag-over');
      }
    }
  };
  const onUp = ()=>{
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
    document.querySelectorAll('.ex-item.dragging,.ex-item.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'));
    if(dragId && dragOverId && dragId !== dragOverId){
      const w = getActiveWorkout();
      const exs = w.exercises;
      const fromIdx = exs.findIndex(e=>e.id===dragId);
      const toIdx = exs.findIndex(e=>e.id===dragOverId);
      if(fromIdx>-1 && toIdx>-1){
        const [moved] = exs.splice(fromIdx,1);
        exs.splice(toIdx,0,moved);
        saveWorkouts(workouts);
        renderWorkout();
        Object.keys(exTimers).forEach(updateExTimerUI);
      }
    }
    dragId = null; dragOverId = null;
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('touchend', onUp);
}

// ════════════ PER-EXERCISE TIMER ════════════
function startExTimer(exId){
  const ex = findEx(exId); if(!ex) return;
  // Cancel any other running timer
  Object.keys(exTimers).forEach(id=>{ if(id!==exId) cancelExTimer(id); });

  const total = ex.rest||0;
  if(total<=0) return;

  exTimers[exId] = { total, left: total, finished: false, intervalId: null };
  const t = exTimers[exId];

  t.intervalId = setInterval(()=>{
    t.left--;
    if(t.left<=0){
      clearInterval(t.intervalId);
      t.left = 0;
      t.finished = true;
      updateExTimerUI(exId);
      showToast('⏱ Rest done — '+ex.name, 2500);
      // auto-hide after 5s
      setTimeout(()=>{ if(exTimers[exId]?.finished) cancelExTimer(exId); }, 5000);
      return;
    }
    updateExTimerUI(exId);
  }, 1000);

  updateExTimerUI(exId);
}

function cancelExTimer(exId){
  const t = exTimers[exId]; if(!t) return;
  if(t.intervalId) clearInterval(t.intervalId);
  delete exTimers[exId];
  const el = document.getElementById('rest-'+exId);
  if(el){ el.classList.remove('active','done-state'); }
}

function updateExTimerUI(exId){
  const t = exTimers[exId]; if(!t) return;
  const el = document.getElementById('rest-'+exId); if(!el) return;
  el.classList.add('active');
  if(t.finished) el.classList.add('done-state');
  const m = Math.floor(t.left/60), s = String(t.left%60).padStart(2,'0');
  const timeEl = document.getElementById('rest-time-'+exId);
  if(timeEl) timeEl.textContent = t.finished ? 'Done ✓' : `${m}:${s}`;
  const fill = document.getElementById('rest-fill-'+exId);
  if(fill) fill.style.width = (t.left/t.total*100)+'%';
}

// ════════════ SESSION (workout duration stopwatch) ════════════
let sessionInterval = null;
// Toggle body class so CSS can hide non-essential sidebar cards during a
// running workout. Idempotent — safe to call multiple times.
function setSessionRunningClass(){
  const running = !!(sessionTimer && sessionTimer.start && !sessionTimer.end);
  document.body.classList.toggle('session-running', running);
}

function startWorkout(){
  if(sessionTimer && !sessionTimer.end){ showToast('Workout already running'); return; }
  sessionTimer = { start: Date.now(), end: null };
  saveSessionTimer(sessionTimer);
  document.getElementById('start-workout-btn').style.display = 'none';
  document.getElementById('finish-workout-btn').style.display = 'inline-flex';
  startSessionTick();
  setSessionRunningClass();
  showToast('🚀 Workout started — go!');
}
function finishWorkout(){
  if(!sessionTimer){ showToast('No active workout'); return; }
  sessionTimer.end = Date.now();
  saveSessionTimer(sessionTimer);
  if(sessionInterval) clearInterval(sessionInterval);

  // Mark today as completed (latest workout)
  const completed = loadCompletedDays();
  completed[TODAY] = activeId;
  saveCompletedDays(completed);

  // Append to session log so future sessions can pull last-week data
  const log = loadSessionLog();
  // Snapshot the set data from current session
  const setsSnapshot = {};
  Object.keys(session).forEach(k=>{
    if(k.endsWith('_sets')){
      const exId = k.slice(0, -('_sets'.length));
      setsSnapshot[exId] = session[k];
    }
  });
  // Snapshot exercise names so log entries remain readable even if the
  // workout's exercises are later renamed or deleted.
  const exerciseNames = {};
  const w = getActiveWorkout();
  (w?.exercises||[]).forEach(ex => { exerciseNames[ex.id] = ex.name; });
  log.push({
    date: TODAY,
    workoutId: activeId,
    workoutName: w?.name || '',
    workoutKind: w?.kind || 'strength',
    start: sessionTimer.start,
    end: sessionTimer.end,
    sets: setsSnapshot,
    exerciseNames,
    notes: '' // notes are permanent now, not per-session
  });
  saveSessionLog(log);

  // Toggle UI: show Continue + New buttons; hide Start/Finish
  document.getElementById('start-workout-btn').style.display = 'none';
  document.getElementById('finish-workout-btn').style.display = 'none';
  document.getElementById('continue-workout-btn').style.display = 'inline-flex';
  document.getElementById('new-session-btn').style.display = 'inline-flex';

  const dur = Math.floor((sessionTimer.end - sessionTimer.start)/1000);
  document.getElementById('duration-time').className = 'duration-time finished';
  document.getElementById('duration-time').textContent = fmtDuration(dur);
  document.getElementById('session-status').textContent = 'Finished';
  document.getElementById('duration-label').textContent = 'Workout logged ✓ — continue or start a new one';

  Object.keys(exTimers).forEach(cancelExTimer);

  const setsDone = Object.keys(session).filter(k=>k.endsWith('_sets')).reduce((a,k)=>a+(session[k]||[]).filter(s=>s.done).length,0);
  const banner = document.getElementById('complete-banner');
  banner.classList.add('show');
  document.getElementById('complete-sub').textContent = `${w?.name||''} · ${fmtDuration(dur)} · ${setsDone} sets`;

  setSessionRunningClass();
  renderWeek();
  showToast('🏆 Workout logged!', 3000);
}

// Continue an already-finished session: re-open timer from where it ended.
// Edge cases handled: missing timer, stale timer (different day), and the
// just-logged entry being modified externally between finish and continue.
function continueWorkout(){
  if(!sessionTimer || !sessionTimer.end){ showToast('No finished session to continue'); return; }
  if(timerIsStale(sessionTimer)){
    showToast('That session was from a previous day. Start a new one.', 3500);
    recoverStaleSession();
    document.getElementById('start-workout-btn').style.display = 'inline-flex';
    document.getElementById('continue-workout-btn').style.display = 'none';
    document.getElementById('new-session-btn').style.display = 'none';
    document.getElementById('finish-workout-btn').style.display = 'none';
    document.getElementById('complete-banner').classList.remove('show');
    document.getElementById('duration-time').className = 'duration-time idle';
    document.getElementById('duration-time').textContent = '0:00';
    document.getElementById('session-status').textContent = 'Not started';
    document.getElementById('duration-label').textContent = 'Press start when ready';
    setSessionRunningClass();
    renderWorkout();
    return;
  }

  // Remove the just-logged entry from session log (it'll be re-logged on next finish).
  // Match by start time AND date (defensive — start times are timestamps so already
  // unique, but the date check protects against Firestore round-trips creating a
  // copy with a slightly different shape).
  const log = loadSessionLog();
  let removed = false;
  for(let i=log.length-1; i>=0; i--){
    if(log[i].date===TODAY && log[i].start===sessionTimer.start){
      log.splice(i,1);
      removed = true;
      break;
    }
  }
  if(removed) saveSessionLog(log);

  // Resume timer: bump start so total elapsed duration stays continuous
  const elapsed = sessionTimer.end - sessionTimer.start;
  sessionTimer = { start: Date.now() - elapsed, end: null };
  saveSessionTimer(sessionTimer);

  document.getElementById('continue-workout-btn').style.display = 'none';
  document.getElementById('new-session-btn').style.display = 'none';
  document.getElementById('finish-workout-btn').style.display = 'inline-flex';
  document.getElementById('complete-banner').classList.remove('show');
  startSessionTick();
  setSessionRunningClass();
  showToast('▶ Session resumed');
}

function startNewSession(){
  // Clear current session-in-progress state but keep prior logged sessions intact
  session = {};
  saveSession(TODAY, session);
  sessionTimer = null;
  saveSessionTimer(null);
  Object.keys(exTimers).forEach(cancelExTimer);
  document.getElementById('start-workout-btn').style.display = 'inline-flex';
  document.getElementById('continue-workout-btn').style.display = 'none';
  document.getElementById('new-session-btn').style.display = 'none';
  document.getElementById('finish-workout-btn').style.display = 'none';
  document.getElementById('complete-banner').classList.remove('show');
  document.getElementById('duration-time').className = 'duration-time idle';
  document.getElementById('duration-time').textContent = '0:00';
  document.getElementById('session-status').textContent = 'Not started';
  document.getElementById('duration-label').textContent = 'Press start when ready';
  setSessionRunningClass();
  renderWorkout();
  renderVolume();
  renderHistory();
  renderWeek();
}

function startSessionTick(){
  if(sessionInterval) clearInterval(sessionInterval);
  sessionInterval = setInterval(updateSessionUI, 1000);
  updateSessionUI();
}

function updateSessionUI(){
  if(!sessionTimer) return;
  const dur = Math.floor(((sessionTimer.end||Date.now()) - sessionTimer.start)/1000);
  const el = document.getElementById('duration-time');
  el.textContent = fmtDuration(dur);
  if(!sessionTimer.end){
    el.className = 'duration-time running';
    document.getElementById('session-status').textContent = 'Running';
    document.getElementById('duration-label').textContent = 'In progress — keep going';
  }
}

// ════════════ VOLUME ════════════
function renderVolume(){
  const w = getActiveWorkout();
  const isSwim = (w?.kind === 'swim');
  let sets=0, repsOrDist=0, kg=0;
  Object.keys(session).forEach(k=>{
    if(k.endsWith('_sets')){
      (session[k]||[]).forEach(s=>{
        if(!s.done) return;
        sets++;
        const r = parseFloat(s.reps)||0; // reps OR distance for swim
        const wt = parseFloat(s.weight)||0;
        repsOrDist += r;
        if(!isSwim) kg += r*wt;
      });
    }
  });
  document.getElementById('vol-sets').textContent = sets;
  document.getElementById('vol-reps').textContent = isSwim ? Math.round(repsOrDist) : repsOrDist;
  document.getElementById('vol-kg').textContent = isSwim ? '—' : Math.round(kg);
  // Update labels too
  const repsLbl = document.querySelector('#volume-card .vol-stat:nth-child(2) .vol-stat-lbl');
  const kgLbl = document.querySelector('#volume-card .vol-stat:nth-child(3) .vol-stat-lbl');
  if(repsLbl) repsLbl.textContent = isSwim ? 'Distance (m)' : 'Reps';
  if(kgLbl) kgLbl.textContent = isSwim ? '' : 'Total kg';
  document.getElementById('volume-card').style.display = sets>0 ? 'block' : 'none';
}

// ════════════ HISTORY ════════════
// Sessions are stored permanently in wt_session_log (synced to Firestore).
// The side panel shows the last 30 days by default with a "Show all" toggle.
let historyShowAll = false;

// Find an exercise by id across ALL workouts (not just the active one).
// This is needed because log entries can reference exercises that were
// renamed/deleted from the workout definition since the session was logged.
// As a third fallback, look at the exerciseNames snapshot stored on each
// log entry (newer feature).
function findExAnywhere(exId, fallbackEntry){
  for(const w of workouts){
    const ex = w.exercises?.find(e=>e.id===exId);
    if(ex) return ex;
  }
  if(fallbackEntry?.exerciseNames?.[exId]){
    return {id: exId, name: fallbackEntry.exerciseNames[exId], cat: ''};
  }
  return null;
}

function fmtSessionDate(dateStr){
  // dateStr is YYYY-MM-DD
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if(sameDay(dt, today)) return 'Today';
  if(sameDay(dt, yest)) return 'Yesterday';
  // Within the last week — show day name
  const diff = Math.round((today - dt) / 86400000);
  if(diff>0 && diff<7) return DAY_NAMES[dt.getDay()];
  return `${dt.getDate()} ${MON_SHORT[dt.getMonth()]}`;
}

function summariseSession(entry){
  // Returns {setsDone, totalReps, totalKg, totalDistance, isSwim}
  // For strength sessions, totalKg = sum of weight × reps; for swim, totalDistance = sum of reps (which holds metres).
  const isSwim = (entry.workoutKind === 'swim');
  let setsDone=0, totalReps=0, totalKg=0, totalDistance=0;
  const sets = entry.sets || {};
  Object.keys(sets).forEach(exId=>{
    (sets[exId]||[]).forEach(s=>{
      if(!s.done) return;
      setsDone++;
      const r = parseFloat(s.reps)||0;
      const wt = parseFloat(s.weight)||0;
      if(isSwim){
        totalDistance += r;
      } else {
        totalReps += r;
        totalKg += r*wt;
      }
    });
  });
  return {setsDone, totalReps, totalKg, totalDistance, isSwim};
}

function renderHistory(){
  const log = loadSessionLog();
  const card = document.getElementById('history-card');
  const list = document.getElementById('hist-list');
  const allBtn = document.getElementById('hist-all-btn');
  const countLbl = document.getElementById('history-count');

  if(!log.length){
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';

  // Newest first. Stable sort: prefer end-time, fall back to start, then date.
  const sorted = [...log].sort((a,b) => (b.end||b.start||0) - (a.end||a.start||0));

  // Default: last 30 days. "Show all": everything stored.
  const cutoff = Date.now() - 30*86400000;
  const recent = sorted.filter(e => (e.end || e.start || 0) >= cutoff);
  const visible = historyShowAll ? sorted : recent;
  const olderCount = sorted.length - recent.length;

  countLbl.textContent = historyShowAll
    ? `${sorted.length} logged`
    : `${visible.length} in last 30 days`;
  allBtn.style.display = olderCount > 0 ? 'inline-block' : 'none';
  allBtn.textContent = historyShowAll ? 'Recent only' : `Show all (${sorted.length})`;

  if(!visible.length){
    list.innerHTML = '<div class="hist-empty">No completed sessions yet</div>';
    return;
  }

  list.innerHTML = visible.map((entry) => {
    const idx = log.indexOf(entry); // stable index in the underlying log
    const {setsDone, totalKg, totalDistance, isSwim} = summariseSession(entry);
    const dur = (entry.end && entry.start) ? Math.floor((entry.end-entry.start)/1000) : 0;
    const durStr = dur>0 ? fmtDuration(dur) : '';
    const dateStr = fmtSessionDate(entry.date);
    const meta = [dateStr, `${setsDone} sets`, durStr].filter(Boolean).join(' · ');
    const stat = isSwim
      ? (totalDistance > 0 ? `${Math.round(totalDistance)} m` : '')
      : (totalKg > 0 ? `${Math.round(totalKg)} kg` : '');
    return `
      <div class="hist-item" onclick="openSessionModal(${idx})" role="button" tabindex="0">
        <div class="hist-item-left">
          <div class="hist-item-name">${escapeHtml(entry.workoutName || 'Workout')}</div>
          <div class="hist-item-meta">${escapeHtml(meta)}</div>
        </div>
        ${stat ? `<div class="hist-item-stat">${stat}</div>` : ''}
      </div>`;
  }).join('');
}

function toggleHistoryAll(){
  historyShowAll = !historyShowAll;
  renderHistory();
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let activeSessionIdx = -1;

function openSessionModal(idx){
  const log = loadSessionLog();
  const entry = log[idx];
  if(!entry){ showToast('Session not found'); return; }
  activeSessionIdx = idx;

  document.getElementById('sm-title').textContent = entry.workoutName || 'Workout';

  const {setsDone, totalReps, totalKg, totalDistance, isSwim} = summariseSession(entry);
  const dur = (entry.end && entry.start) ? Math.floor((entry.end-entry.start)/1000) : 0;
  const fullDate = (() => {
    const [y,m,d] = entry.date.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return `${DAY_NAMES[dt.getDay()]}, ${dt.getDate()} ${MON_SHORT[dt.getMonth()]} ${dt.getFullYear()}`;
  })();
  document.getElementById('sm-sub').textContent = fullDate;

  // Body: meta pills + per-exercise set listing
  const body = document.getElementById('sm-body');
  let html = '<div class="sess-meta-row">';
  if(dur>0) html += `<div class="sess-meta-pill">Duration <strong>${fmtDuration(dur)}</strong></div>`;
  html += `<div class="sess-meta-pill">Sets <strong>${setsDone}</strong></div>`;
  if(isSwim){
    if(totalDistance>0) html += `<div class="sess-meta-pill">Distance <strong>${Math.round(totalDistance)} m</strong></div>`;
  } else {
    html += `<div class="sess-meta-pill">Reps <strong>${totalReps}</strong></div>`;
    if(totalKg>0) html += `<div class="sess-meta-pill">Volume <strong>${Math.round(totalKg)} kg</strong></div>`;
  }
  html += '</div>';

  const sets = entry.sets || {};
  const exIds = Object.keys(sets);
  if(!exIds.length){
    html += '<div class="sess-no-data">No set data was recorded for this session.</div>';
  } else {
    exIds.forEach(exId => {
      const exSets = (sets[exId]||[]).filter(s=>s.done);
      if(!exSets.length) return;
      const ex = findExAnywhere(exId, entry);
      const name = ex?.name || entry.exerciseNames?.[exId] || exId;
      const cat = ex?.cat || '';
      const isSwimEntry = (entry.workoutKind === 'swim');
      html += '<div class="sess-ex">';
      html += `<div class="sess-ex-head"><div class="sess-ex-name">${escapeHtml(name)}</div>`;
      if(cat) html += `<div class="sess-ex-meta">${escapeHtml(cat)}</div>`;
      html += '</div>';
      exSets.forEach((s, i) => {
        const reps = (s.reps !== '' && s.reps != null) ? s.reps : '—';
        const wt = (s.weight !== '' && s.weight != null && s.weight !== 0) ? s.weight : '';
        let tag = '';
        if(isSwimEntry && s.type){
          const strokeName = {free:'Freestyle',back:'Back',breast:'Breast',fly:'Fly',im:'IM',kick:'Kick',pull:'Pull',drill:'Drill'}[s.type] || s.type;
          tag = `<span class="sess-set-tag">${escapeHtml(strokeName)}</span>`;
        } else if(s.type === 'warmup'){
          tag = '<span class="sess-set-tag">Warm-up</span>';
        }
        const repsUnit = isSwimEntry ? 'm' : 'reps';
        const wtUnit = isSwimEntry ? '' : 'kg';
        html += '<div class="sess-set-row">';
        html += `<div class="sess-set-num">Set ${i+1}</div>`;
        html += `<div class="sess-set-val">${escapeHtml(String(reps))}<small>${repsUnit}</small></div>`;
        html += `<div class="sess-set-val">${wt!==''?escapeHtml(String(wt))+(wtUnit?'<small>'+wtUnit+'</small>':''):'<span style="color:var(--muted)">—</span>'}</div>`;
        html += `<div>${tag}</div>`;
        html += '</div>';
      });
      html += '</div>';
    });
  }
  body.innerHTML = html;

  document.getElementById('session-modal').classList.add('open');
}

function deleteSessionFromModal(){
  if(activeSessionIdx < 0) return;
  if(!confirm('Delete this session entry? This cannot be undone.')) return;
  const log = loadSessionLog();
  if(activeSessionIdx >= log.length){ closeModal('session-modal'); return; }
  log.splice(activeSessionIdx, 1);
  saveSessionLog(log);
  closeModal('session-modal');
  renderHistory();
  renderWeek?.();
  showToast('Session deleted');
}

// ════════════ ADD EXERCISE ════════════
function openAddExercise(){
  ['new-ex-name','new-ex-reps','new-ex-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('new-ex-sets').value='3';
  document.getElementById('new-ex-rest-min').value='1';
  document.getElementById('new-ex-rest-sec').value='30';
  openModal('add-ex-modal');
}
function addCustomExercise(){
  const name = document.getElementById('new-ex-name').value.trim();
  if(!name){ showToast('Enter an exercise name'); return; }
  const cat = document.getElementById('new-ex-cat').value;
  const sets = Math.max(1, parseInt(document.getElementById('new-ex-sets').value)||3);
  const reps = document.getElementById('new-ex-reps').value.trim()||'—';
  const restM = parseInt(document.getElementById('new-ex-rest-min').value)||0;
  const restS = parseInt(document.getElementById('new-ex-rest-sec').value)||0;
  const note = document.getElementById('new-ex-notes').value.trim();
  const id = 'custom_'+Date.now();
  const ex = {id, name, cat, sets, reps, rest: restM*60+restS, note};
  const w = getActiveWorkout();
  if(!w){ showToast('No active workout'); return; }
  w.exercises.push(ex);
  saveWorkouts(workouts);
  closeModal('add-ex-modal');
  renderWorkout();
  showToast('Exercise added');
}

// ════════════ ADD/EDIT WORKOUT ════════════
let editingWorkoutId = null;
function openAddWorkout(){
  editingWorkoutId = null;
  document.getElementById('wm-title').textContent = 'New workout';
  document.getElementById('wm-sub').textContent = 'Create a custom workout type';
  document.getElementById('wm-name').value='';
  document.getElementById('wm-type').value='';
  document.getElementById('wm-delete').style.display='none';
  openModal('workout-modal');
}
function openEditWorkout(id){
  const w = workouts.find(x=>x.id===id); if(!w) return;
  editingWorkoutId = id;
  document.getElementById('wm-title').textContent = 'Edit workout';
  document.getElementById('wm-sub').textContent = w.name;
  document.getElementById('wm-name').value = w.name;
  document.getElementById('wm-type').value = w.type;
  document.getElementById('wm-delete').style.display = workouts.length>1 ? 'inline-flex' : 'none';
  openModal('workout-modal');
}
function saveWorkout(){
  const name = document.getElementById('wm-name').value.trim();
  const type = document.getElementById('wm-type').value.trim() || 'Custom';
  if(!name){ showToast('Enter a workout name'); return; }
  if(editingWorkoutId){
    const w = workouts.find(x=>x.id===editingWorkoutId);
    w.name = name; w.type = type;
  } else {
    const id = 'wk_'+Date.now();
    workouts.push({id, name, type, exercises:[]});
    activeId = id;
    localStorage.setItem(ACTIVE_KEY, id);
  }
  saveWorkouts(workouts);
  closeModal('workout-modal');
  renderWorkoutList();
  renderWorkout();
  showToast(editingWorkoutId ? 'Workout updated' : 'Workout created');
}
function deleteWorkout(){
  if(!editingWorkoutId || workouts.length<=1) return;
  if(!confirm('Delete this workout?')) return;
  workouts = workouts.filter(w=>w.id!==editingWorkoutId);
  if(activeId===editingWorkoutId) activeId = workouts[0].id;
  localStorage.setItem(ACTIVE_KEY, activeId);
  saveWorkouts(workouts);
  closeModal('workout-modal');
  renderWorkoutList();
  renderWorkout();
  showToast('Workout deleted');
}

// ════════════ MODAL HELPERS ════════════
function openModal(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
function handleModalClick(e,id){ if(e.target===document.getElementById(id)) closeModal(id); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open')); document.body.style.overflow=''; } });

// ════════════ STATE RECOVERY ════════════
// Helper: is a timer's start (or end) on a different calendar day from today?
function timerIsStale(timer){
  if(!timer) return false;
  const ref = timer.end || timer.start;
  if(!ref) return false;
  const d = new Date(ref);
  return fmtDate(d) !== TODAY;
}

// If there's a left-over running timer from a previous day (e.g. user opened
// the app, marked a set, then closed without finishing), auto-finalise it as
// a logged session for that prior day rather than letting it leak into today.
// If a finished timer is from a previous day, just clear it: the session is
// already logged, today should start fresh.
function recoverStaleSession(){
  if(!sessionTimer || !timerIsStale(sessionTimer)) return false;

  if(sessionTimer.end){
    // Already finished, just from a prior day. Clear and start clean.
    sessionTimer = null;
    saveSessionTimer(null);
    return true;
  }

  // Running timer from a prior day — auto-finalise so we don't lose the data.
  // Use the timer's date (not today) and compute end as start + elapsed (cap
  // at 4 hours because long-running orphaned timers are almost certainly an
  // unfinished session, not a real 12-hour workout).
  const startDate = fmtDate(new Date(sessionTimer.start));
  const cappedEnd = Math.min(sessionTimer.start + 4*3600*1000, Date.now());
  const sessionForThatDay = (() => {
    try{ return JSON.parse(localStorage.getItem(SESSION_KEY(startDate))) || {}; }
    catch(e){ return {}; }
  })();

  // Snapshot any sets that were entered for that day
  const setsSnapshot = {};
  let anySets = false;
  Object.keys(sessionForThatDay).forEach(k => {
    if(k.endsWith('_sets')){
      const exId = k.slice(0, -('_sets'.length));
      const arr = sessionForThatDay[k] || [];
      // Only log if at least one set was marked done
      if(arr.some(s => s.done)){
        setsSnapshot[exId] = arr;
        anySets = true;
      }
    }
  });

  if(anySets){
    // Persist as a completed session for that day
    const log = loadSessionLog();
    // Avoid duplicating if a finalisation entry already exists for the same start time
    const exists = log.some(e => e.start === sessionTimer.start);
    if(!exists){
      log.push({
        date: startDate,
        workoutId: activeId,
        workoutName: getActiveWorkout()?.name || '',
        start: sessionTimer.start,
        end: cappedEnd,
        sets: setsSnapshot,
        notes: '',
        autoFinalised: true,
      });
      saveSessionLog(log);
      const completed = loadCompletedDays();
      if(!completed[startDate]){
        completed[startDate] = activeId;
        saveCompletedDays(completed);
      }
      showToast(`⏱ Recovered unfinished session from ${fmtPRDate(startDate)}`, 4000);
    }
  }

  sessionTimer = null;
  saveSessionTimer(null);
  return true;
}

// ════════════ INIT ════════════
function init(){
  // Run state recovery BEFORE first render so renderWorkout sees a clean state.
  recoverStaleSession();

  renderWorkoutList();
  renderWorkout();
  renderVolume();
  renderHistory();
  renderWeek();

  // Restore session timer (only valid if not stale, which recovery already handled)
  if(sessionTimer){
    if(sessionTimer.end){
      const dur = Math.floor((sessionTimer.end-sessionTimer.start)/1000);
      document.getElementById('duration-time').className = 'duration-time finished';
      document.getElementById('duration-time').textContent = fmtDuration(dur);
      document.getElementById('session-status').textContent = 'Finished';
      document.getElementById('duration-label').textContent = 'Workout logged ✓ — continue or start a new one';
      document.getElementById('start-workout-btn').style.display = 'none';
      document.getElementById('continue-workout-btn').style.display = 'inline-flex';
      document.getElementById('new-session-btn').style.display = 'inline-flex';
    } else {
      document.getElementById('start-workout-btn').style.display = 'none';
      document.getElementById('finish-workout-btn').style.display = 'inline-flex';
      startSessionTick();
    }
  }
  setSessionRunningClass();

  // Watch for the page becoming visible again after being hidden for a while
  // (e.g. phone went to sleep mid-rest). Re-run recovery if a day boundary
  // was crossed while we were away.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible') return;
    // Midnight rollover: if the calendar day changed while we were hidden,
    // reload so TODAY and everything dependent on it re-initialises.
    if(fmtDate(new Date()) !== TODAY){
      window.location.reload();
      return;
    }
    // If a finished session timer is suddenly stale, gently reset to today.
    if(sessionTimer && timerIsStale(sessionTimer)){
      recoverStaleSession();
      // Reset UI to fresh-day state
      document.getElementById('start-workout-btn').style.display = 'inline-flex';
      document.getElementById('continue-workout-btn').style.display = 'none';
      document.getElementById('new-session-btn').style.display = 'none';
      document.getElementById('finish-workout-btn').style.display = 'none';
      document.getElementById('complete-banner').classList.remove('show');
      document.getElementById('duration-time').className = 'duration-time idle';
      document.getElementById('duration-time').textContent = '0:00';
      document.getElementById('session-status').textContent = 'Not started';
      document.getElementById('duration-label').textContent = 'Press start when ready';
      setSessionRunningClass();
      renderWorkout();
    }
  });

  // Active rollover: schedule a check at the next local midnight.
  // Reloads the page if a session isn't actively running (so we don't
  // disrupt mid-workout). If a session IS running at midnight, we let
  // it continue and the rollover will happen on next visibilitychange
  // or when the user finishes.
  (function scheduleRollover(){
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5);
    setTimeout(() => {
      if(fmtDate(new Date()) !== TODAY){
        if(!sessionTimer || sessionTimer.end){
          window.location.reload();
        }
      }
    }, next.getTime() - now.getTime());
  })();
}
init();
</script>
