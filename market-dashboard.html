<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Match daily dashboard palette */
  --bg:#0D0D0B;
  --card:#161614;
  --card2:#1C1C19;
  --border:#272522;
  --border2:#2F2D2A;
  --text:#F5F3EF;
  --muted:#C0BBB2;
  --muted2:#9B978F;

  /* Accents from daily dashboard */
  --ws-c:#A5B4FC;       --ws-bg:#0A0C1F;      --ws-bd:#1A1F45;     /* indigo = Wall Street */
  --asx-c:#86EFAC;      --asx-bg:#071A0F;     --asx-bd:#134D22;    /* green = ASX */
  --chart-c:#7DD3FC;    --chart-bg:#061520;   --chart-bd:#0D2F45;  /* cyan = charts */
  --news-c:#FCD34D;     --news-bg:#1A1500;    --news-bd:#3D3000;   /* amber = news */
  --danger-c:#F9A8D4;   --danger-bg:#190A12;  --danger-bd:#3D1828;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:28px 24px;
  line-height:1.5;
}

/* Disable double-tap-to-zoom on touch devices but keep pinch zoom intact. */
*{touch-action:manipulation}

/* ========= Header ========= */
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:20px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}
.header-left .title-label{
  font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;
}
.header-left .title-main{
  font-family:'Outfit',sans-serif;font-size:42px;font-weight:400;line-height:1;
}
.header-left .title-sub{
  font-family:'Outfit',sans-serif;font-size:17px;color:var(--muted);margin-top:4px;
}
.header-right{display:flex;align-items:center;gap:10px}

.ghost-btn{
  display:inline-flex;align-items:center;gap:7px;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;
  padding:8px 14px;border-radius:9px;
  background:var(--card);border:1px solid var(--border);color:var(--text);
  cursor:pointer;transition:background .12s,border-color .12s;
}
.ghost-btn:hover{background:var(--card2);border-color:var(--border2)}
.ghost-btn .plus{font-size:14px;line-height:1;color:var(--muted)}

/* ========= Grid ========= */
.dashboard-grid{
  display:grid;
  grid-template-columns:320px 1fr 360px;
  gap:16px;
  align-items:start;
  height:calc(100vh - 160px);
  min-height:640px;
}
.col-watchlists,.col-charts{
  display:flex;flex-direction:column;gap:16px;height:100%;
}
.col-news{height:100%}

/* ========= Card shell ========= */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  display:flex;flex-direction:column;
  flex:1;min-height:0;
  animation:fadeUp .2s ease both;
  overflow:hidden;
}
.col-news .card{flex:1 1 100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.card-head{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-shrink:0;
}
.section-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:6px;border:1px solid;flex-shrink:0;
}
.badge-ws{color:var(--ws-c);background:var(--ws-bg);border-color:var(--ws-bd)}
.badge-asx{color:var(--asx-c);background:var(--asx-bg);border-color:var(--asx-bd)}
.badge-chart{color:var(--chart-c);background:var(--chart-bg);border-color:var(--chart-bd)}
.badge-news{color:var(--news-c);background:var(--news-bg);border-color:var(--news-bd)}
.card-sub{font-size:11px;color:var(--muted)}
.card-meta{font-size:11px;color:var(--muted);margin-left:auto}

/* The widget area fills the rest */
.widget-host{
  flex:1;min-height:0;
  border-radius:10px;
  overflow:hidden;
  background:var(--bg);
  border:1px solid var(--border);
}
.widget-host > div,
.widget-host .tradingview-widget-container,
.widget-host .tradingview-widget-container > div{height:100% !important;width:100% !important}

/* ========= Modal ========= */
#settingsModal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:1000;align-items:center;justify-content:center;padding:20px;
}
#settingsModal.open{display:flex}
.modal-content{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  width:640px;max-width:100%;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:fadeUp .2s ease both;
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-head-left .modal-label{
  font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;
}
.modal-head-left .modal-title{
  font-family:'Outfit',sans-serif;font-size:24px;font-weight:400;line-height:1;
}
.close-btn{
  width:30px;height:30px;border-radius:8px;
  background:none;border:1px solid var(--border);color:var(--muted);
  cursor:pointer;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;
}
.close-btn:hover{background:var(--card2);color:var(--text)}

.modal-body{padding:16px 20px 20px;overflow-y:auto;flex:1}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

.hint{font-size:11px;color:var(--muted2);margin-bottom:14px;line-height:1.5}
.hint code{font-family:ui-monospace,Menlo,monospace;background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10.5px;color:var(--muted)}

.input-group{
  display:grid;grid-template-columns:120px 140px 1fr auto;gap:8px;margin-bottom:20px;
}
.input-group select,
.input-group input{
  padding:9px 11px;
  background:var(--card2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:8px;
  font-size:13px;
  font-family:'DM Sans',sans-serif;
  outline:none;
  transition:border-color .12s;
}
.input-group select:focus,
.input-group input:focus{border-color:var(--border2)}
.input-group input::placeholder{color:var(--muted2)}

.add-btn{
  background:var(--card2);color:var(--text);border:1px solid var(--border2);
  padding:9px 16px;border-radius:8px;cursor:pointer;
  font-weight:500;font-size:13px;font-family:'DM Sans',sans-serif;
  transition:background .12s,border-color .12s;
}
.add-btn:hover{background:var(--border);border-color:var(--muted2)}

.stock-list-container{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;
}
.stock-category h3{
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--border);
}
.stock-list{
  display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto;padding-right:4px;
}
.stock-list::-webkit-scrollbar{width:4px}
.stock-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.stock-item{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--card2);border:1px solid var(--border);
  padding:8px 10px;border-radius:8px;font-size:12.5px;
}
.stock-item .tick{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ws-c)}
.stock-category:last-child .stock-item .tick{color:var(--asx-c)}
.stock-item .nm{color:var(--muted);font-size:11.5px;margin-left:6px}
.stock-item .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.remove-btn{
  background:transparent;color:var(--danger-c);border:1px solid var(--danger-bd);
  border-radius:6px;cursor:pointer;padding:3px 8px;font-size:10.5px;font-weight:500;
  transition:background .12s,color .12s;flex-shrink:0;font-family:'DM Sans',sans-serif;
}
.remove-btn:hover{background:var(--danger-bg);color:var(--danger-c)}
.empty-note{font-size:12px;color:var(--muted2);padding:12px 4px;font-style:italic}

.save-reload-btn{
  width:100%;
  background:var(--card2);color:var(--text);
  border:1px solid var(--border2);
  padding:12px;border-radius:10px;font-size:13px;font-weight:500;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:background .12s,border-color .12s;
}
.save-reload-btn:hover{background:var(--border);border-color:var(--muted2)}

/* ========= Responsive ========= */
@media(max-width:1200px){
  .dashboard-grid{grid-template-columns:1fr;height:auto;min-height:0}
  .card{min-height:380px;flex:none}
  .col-watchlists,.col-charts{height:auto}
}
@media(max-width:720px){
  body{padding:16px}
  .header-left .title-main{font-size:32px}
  .input-group{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
  .input-group .add-btn{grid-column:1/-1}
  .stock-list-container{grid-template-columns:1fr}
}

/* ───────────────────────────────────────────────────────────
   Mobile pass — overrides only fire below 600px
   ─────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  body {
    padding: 12px 12px 24px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-left:  max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    font-size: 14px;
  }
  .header { margin-bottom: 12px; padding-bottom: 12px; align-items: center; }
  .header-left .title-label { font-size: 9px; margin-bottom: 3px; }
  .header-left .title-main  { font-size: 24px; }
  .header-left .title-sub   { font-size: 13px; margin-top: 2px; }
  .header-right { gap: 6px; }
  .ghost-btn { font-size: 11px; padding: 6px 10px; }

  .dashboard-grid { gap: 10px; height: auto; min-height: 0; }
  .card {
    min-height: 320px;
    padding: 12px;
    border-radius: 12px;
  }
  .card-head { margin-bottom: 8px; }
  .section-badge { font-size: 9px; padding: 2px 7px; }
}

@media (max-width: 380px) {
  .header-left .title-main { font-size: 22px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="title-label">Markets</div>
    <div class="title-main">Market Dashboard</div>
    <div class="title-sub" id="market-sub">Wall Street · ASX · Global news</div>
  </div>
  <div class="header-right">
    <button class="ghost-btn" id="settingsBtn">
      <span class="plus">+</span>
      <span>Add stock</span>
    </button>
  </div>
</div>

<div class="dashboard-grid">

  <div class="col-watchlists">
    <div class="card">
      <div class="card-head">
        <span class="section-badge badge-ws">Wall St</span>
        <span class="card-sub">US equities</span>
        <span class="card-meta" id="ws-count"></span>
      </div>
      <div class="widget-host" id="tv-watchlist-ws"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <span class="section-badge badge-asx">ASX</span>
        <span class="card-sub">Australian equities</span>
        <span class="card-meta" id="asx-count"></span>
      </div>
      <div class="widget-host" id="tv-watchlist-asx"></div>
    </div>
  </div>

  <div class="col-charts">
    <div class="card">
      <div class="card-head">
        <span class="section-badge badge-chart">Chart</span>
        <span class="card-sub" id="chart-top-label">—</span>
      </div>
      <div class="widget-host" id="tv-chart-top"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <span class="section-badge badge-chart">Chart</span>
        <span class="card-sub" id="chart-bottom-label">—</span>
      </div>
      <div class="widget-host" id="tv-chart-bottom"></div>
    </div>
  </div>

  <div class="col-news">
    <div class="card">
      <div class="card-head">
        <span class="section-badge badge-news">News</span>
        <span class="card-sub">Market headlines</span>
      </div>
      <div class="widget-host" id="tv-news">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
          {
            "feedMode": "all_symbols",
            "colorTheme": "dark",
            "isTransparent": true,
            "displayMode": "regular",
            "width": "100%",
            "height": "100%",
            "locale": "en"
          }
          </script>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="settingsModal" role="dialog" aria-modal="true">
  <div class="modal-content">
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-label">Settings</div>
        <div class="modal-title">Manage portfolio</div>
      </div>
      <button class="close-btn" id="closeSettings" aria-label="Close">&#10005;</button>
    </div>
    <div class="modal-body">
      <p class="hint">
        Format: <code>EXCHANGE:TICKER</code> — e.g. <code>NASDAQ:AAPL</code> or <code>ASX:BHP</code>.
      </p>

      <div class="input-group">
        <select id="newCategory">
          <option value="Wall Street">Wall Street</option>
          <option value="ASX">ASX</option>
        </select>
        <input type="text" id="newTicker" placeholder="EXCHANGE:TICKER">
        <input type="text" id="newName" placeholder="Company name">
        <button class="add-btn" id="addStockBtn">Add</button>
      </div>

      <div class="stock-list-container">
        <div class="stock-category">
          <h3>Wall Street</h3>
          <div class="stock-list" id="wallStreetList"></div>
        </div>
        <div class="stock-category">
          <h3>ASX</h3>
          <div class="stock-list" id="asxList"></div>
        </div>
      </div>

      <button class="save-reload-btn" id="saveBtn">Save &amp; refresh dashboard</button>
    </div>
  </div>
</div>

<script>
// --- DATA ---
const defaultStocks = {
  "Wall Street": [
    { "s": "NASDAQ:AAPL", "d": "Apple" },
    { "s": "NASDAQ:TSLA", "d": "Tesla" },
    { "s": "NASDAQ:MSFT", "d": "Microsoft" }
  ],
  "ASX": [
    { "s": "ASX:BHP", "d": "BHP Group" },
    { "s": "ASX:CBA", "d": "CommBank" },
    { "s": "ASX:CSL", "d": "CSL Limited" }
  ]
};

let myStocks = JSON.parse(localStorage.getItem('myCustomStocks')) || defaultStocks;

// --- WIDGETS ---
function renderWidgets(){
  // meta counts
  document.getElementById('ws-count').textContent  = myStocks["Wall Street"].length + ' symbols';
  document.getElementById('asx-count').textContent = myStocks["ASX"].length + ' symbols';

  // Watchlist — Wall Street
  const wsHost = document.getElementById('tv-watchlist-ws');
  wsHost.innerHTML = '<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';
  const wsScript = document.createElement('script');
  wsScript.type = 'text/javascript';
  wsScript.src = 'https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js';
  wsScript.async = true;
  wsScript.innerHTML = JSON.stringify({
    "colorTheme":"dark","dateRange":"1D","showChart":true,"locale":"en",
    "width":"100%","height":"100%","largeChartUrl":"","isTransparent":true,
    "showSymbolLogo":true,"showFloatingTooltip":true,
    "tabs":[{"title":"Wall Street","symbols":myStocks["Wall Street"]}]
  });
  wsHost.querySelector('.tradingview-widget-container').appendChild(wsScript);

  // Watchlist — ASX
  const asxHost = document.getElementById('tv-watchlist-asx');
  asxHost.innerHTML = '<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';
  const asxScript = document.createElement('script');
  asxScript.type = 'text/javascript';
  asxScript.src = 'https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js';
  asxScript.async = true;
  asxScript.innerHTML = JSON.stringify({
    "colorTheme":"dark","dateRange":"1D","showChart":true,"locale":"en",
    "width":"100%","height":"100%","largeChartUrl":"","isTransparent":true,
    "showSymbolLogo":true,"showFloatingTooltip":true,
    "tabs":[{"title":"ASX","symbols":myStocks["ASX"]}]
  });
  asxHost.querySelector('.tradingview-widget-container').appendChild(asxScript);

  // Top chart
  const topSym = myStocks["Wall Street"][0]?.s || "NASDAQ:AAPL";
  const topName = myStocks["Wall Street"][0]?.d || "";
  document.getElementById('chart-top-label').textContent = topSym + (topName ? ' · ' + topName : '');
  const topHost = document.getElementById('tv-chart-top');
  topHost.innerHTML = '<div class="tradingview-widget-container" style="height:100%;width:100%"><div id="tradingview_chart_top" style="height:100%;width:100%"></div></div>';
  const topScript = document.createElement('script');
  topScript.type = 'text/javascript';
  topScript.src = 'https://s3.tradingview.com/tv.js';
  topScript.onload = function(){
    new TradingView.widget({
      "autosize":true,"symbol":topSym,"interval":"D",
      "timezone":"exchange","theme":"dark","style":"1","locale":"en",
      "enable_publishing":false,"backgroundColor":"#0D0D0B","gridColor":"rgba(255,255,255,0.03)",
      "hide_top_toolbar":false,"hide_legend":false,"save_image":false,
      "allow_symbol_change":true,"details":false,"hotlist":false,
      "calendar":false,"withdateranges":true,"container_id":"tradingview_chart_top"
    });
  };
  topHost.appendChild(topScript);

  // Bottom chart
  const botSym = myStocks["ASX"][0]?.s || "ASX:BHP";
  const botName = myStocks["ASX"][0]?.d || "";
  document.getElementById('chart-bottom-label').textContent = botSym + (botName ? ' · ' + botName : '');
  const botHost = document.getElementById('tv-chart-bottom');
  botHost.innerHTML = '<div class="tradingview-widget-container" style="height:100%;width:100%"><div id="tradingview_chart_bottom" style="height:100%;width:100%"></div></div>';
  const botScript = document.createElement('script');
  botScript.type = 'text/javascript';
  botScript.src = 'https://s3.tradingview.com/tv.js';
  botScript.onload = function(){
    new TradingView.widget({
      "autosize":true,"symbol":botSym,"interval":"D",
      "timezone":"exchange","theme":"dark","style":"1","locale":"en",
      "enable_publishing":false,"backgroundColor":"#0D0D0B","gridColor":"rgba(255,255,255,0.03)",
      "hide_top_toolbar":false,"hide_legend":false,"save_image":false,
      "allow_symbol_change":true,"details":false,"hotlist":false,
      "calendar":false,"withdateranges":true,"container_id":"tradingview_chart_bottom"
    });
  };
  botHost.appendChild(botScript);
}

// --- MODAL ---
const modal = document.getElementById('settingsModal');
const settingsBtn = document.getElementById('settingsBtn');
const closeSettings = document.getElementById('closeSettings');

settingsBtn.onclick = () => { renderSettingsList(); modal.classList.add('open'); };
closeSettings.onclick = () => modal.classList.remove('open');
modal.addEventListener('click', e => { if(e.target === modal) modal.classList.remove('open'); });

function renderSettingsList(){
  const wsList  = document.getElementById('wallStreetList');
  const asxList = document.getElementById('asxList');
  wsList.innerHTML = ''; asxList.innerHTML = '';

  if(myStocks["Wall Street"].length === 0){
    wsList.innerHTML = '<div class="empty-note">No Wall Street symbols yet.</div>';
  } else {
    myStocks["Wall Street"].forEach((stock, index) => {
      wsList.insertAdjacentHTML('beforeend',
        `<div class="stock-item">
           <div class="txt"><span class="tick">${stock.s}</span><span class="nm">${stock.d}</span></div>
           <button class="remove-btn" onclick="removeStock('Wall Street', ${index})">Remove</button>
         </div>`);
    });
  }

  if(myStocks["ASX"].length === 0){
    asxList.innerHTML = '<div class="empty-note">No ASX symbols yet.</div>';
  } else {
    myStocks["ASX"].forEach((stock, index) => {
      asxList.insertAdjacentHTML('beforeend',
        `<div class="stock-item">
           <div class="txt"><span class="tick">${stock.s}</span><span class="nm">${stock.d}</span></div>
           <button class="remove-btn" onclick="removeStock('ASX', ${index})">Remove</button>
         </div>`);
    });
  }
}

document.getElementById('addStockBtn').onclick = () => {
  const category = document.getElementById('newCategory').value;
  const ticker = document.getElementById('newTicker').value.trim().toUpperCase();
  const name = document.getElementById('newName').value.trim();
  if(ticker && name){
    myStocks[category].push({ "s": ticker, "d": name });
    document.getElementById('newTicker').value = '';
    document.getElementById('newName').value = '';
    renderSettingsList();
  } else {
    alert("Please enter both a ticker and a name.");
  }
};

window.removeStock = function(category, index){
  myStocks[category].splice(index, 1);
  renderSettingsList();
};

document.getElementById('saveBtn').onclick = () => {
  localStorage.setItem('myCustomStocks', JSON.stringify(myStocks));
  location.reload();
};

// ESC closes modal
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') modal.classList.remove('open');
});

renderWidgets();
</script>
</body>
</html>
